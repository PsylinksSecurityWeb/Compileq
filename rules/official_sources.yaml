# Official regulator/source registry.
#
# This is the allowlist for the out-of-knowledge fallback protocol
# (scanner/web_lookup.py). When the scanner or the host AI needs to verify
# or research a regulation, it should ONLY treat these domains as
# authoritative — never a law firm blog, "compliance platform" marketing
# page, or aggregator site, even if it ranks higher in search results.
#
# Each entry:
#   code: internal short code (matches rules/*.yaml `regulation:` where one exists)
#   name: full name
#   jurisdiction: country/region code(s)
#   regulator: the enforcing authority's name
#   official_domains: ONLY these domains are treated as authoritative
#   has_active_rules: whether rules/<code>.yaml exists with pattern rules yet
#   verified_date: when this registry entry was last checked
#
# Contributing a new entry: verify the domain is genuinely the government/
# regulator's own site (not a private "compliance guide" site with a
# similar name), then open a PR. See CONTRIBUTING.md.

sources:
  - code: GDPR
    name: General Data Protection Regulation
    jurisdiction: [EU, EEA]
    regulator: European Data Protection Board / national DPAs
    official_domains: ["eur-lex.europa.eu", "edpb.europa.eu"]
    has_active_rules: true
    verified_date: "2026-09-10"

